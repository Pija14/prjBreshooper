services:
  db:
    image: postgres:16-alpine
    container_name: breshopper-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-breshopper}
      POSTGRES_USER: ${POSTGRES_USER:-breshopper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-breshopper}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breshopper -d breshopper"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: breshopper-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://breshopper:breshopper@db:5432/breshopper}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  web:
    image: nginx:alpine
    container_name: breshopper-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  postgres_data:
